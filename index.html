<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V rekonstrukci — Ujváry Studio</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Web se právě předělává. Brzy jsme zpět.">
  <style>
    :root{
      --bg:#faf9f7; --ink:#1a1a1a; --muted:#6b6b6b; --accent:#1f9d6b;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0d0f0e; --ink:#faf9f7; --muted:#9a9a95; --accent:#3ddc97; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    main{ text-align:center; max-width:34rem }
    .emoji{ font-size:clamp(3.5rem,12vw,6rem); line-height:1; display:block; margin-bottom:1.25rem }
    h1{
      font-size:clamp(1.9rem,6vw,3rem); font-weight:600; letter-spacing:-.02em;
      margin:0 0 .6rem;
    }
    h1 span{ color:var(--accent) }
    p{ font-size:clamp(1rem,2.6vw,1.15rem); color:var(--muted); margin:0 }
  </style>
</head>
<body>
  <main>
    <span class="emoji" role="img" aria-label="úsměv">😊</span>
    <h1>V <span>rekonstrukci</span></h1>
    <p>Web se právě předělává. Brzy jsme zpět.</p>
  </main>
</body>
</html>
